<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Favicon and title are dynamically set by WhiteLabelHelmet component -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    
    <!-- DNS Prefetch & Preconnect for faster API calls -->
    <link rel="dns-prefetch" href="https://storage.googleapis.com" />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="manifest" href="/manifest.json" />
    <style>
      html, body, #root {
        height: 100vh;
        margin: 0;
        padding: 0;
      }
    </style>
    <title>Loading...</title>

    <!-- Early Favicon Preload Script - Prevents default favicon flash -->
    <script>
      (function() {
        try {
          // Check if domain is hostbuddy.ai (use default favicon)
          var hostname = window.location.hostname;
          var isHostBuddy = hostname === 'hostbuddy.ai' || hostname === 'www.hostbuddy.ai';
          
          if (isHostBuddy) {
            // HostBuddy domain - use default favicon
            return;
          }
          
          // For white-label domains, check IndexedDB cache for logo
          var dbName = 'WhiteLabelCache';
          var storeName = 'logos';
          var cacheKey = 'logo_' + hostname;
          
          var request = indexedDB.open(dbName, 1);
          
          request.onsuccess = function(event) {
            var db = event.target.result;
            if (!db.objectStoreNames.contains(storeName)) {
              return;
            }
            
            var transaction = db.transaction([storeName], 'readonly');
            var objectStore = transaction.objectStore(storeName);
            var getRequest = objectStore.get(cacheKey);
            
            getRequest.onsuccess = function() {
              var cached = getRequest.result;
              if (cached && cached.data && cached.data.logo) {
                var now = Date.now();
                var age = now - cached.timestamp;
                var maxAge = 60 * 60 * 1000; // 1 hour
                
                // If cache is valid, set favicon immediately
                if (age < maxAge) {
                  var link = document.createElement('link');
                  link.rel = 'icon';
                  link.type = 'image/png';
                  link.href = cached.data.logo;
                  document.head.appendChild(link);
                  
                  console.log('✅ [EARLY FAVICON] Loaded from cache:', cached.data.logo);
                }
              }
            };
          };
        } catch (e) {
          // Silently fail - React Helmet will handle it
          console.log('⚠️ [EARLY FAVICON] Failed to load from cache, React Helmet will handle it');
        }
      })();
    </script>

    <!-- Google Ads Event snippet, to measure & report actions. -->

          'book-a-demo': 'AW-16726426864/KEktCITf49kZEPCJ5Kc-',

        var callback = function () {
          if (false) {
          }
        };
        gtag('event', 'conversion', { 'send_to': send_to, 'event_callback': callback });
        return false;
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
